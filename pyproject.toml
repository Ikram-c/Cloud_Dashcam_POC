[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Cloud_Dashcam_POC"
version = "0.5.1"
description = "Quality-gated, illumination-aware, coverage-chunked frame extraction"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Ikram Choudhury"}]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
metadata = ["pymediainfo>=6.0"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
coverage = ["gpxpy>=1.6", "networkx>=3.0"]
gcs = ["google-cloud-storage>=2.14"]
pythonanywhere = ["a2wsgi>=1.10", "Cloud_Dashcam_POC[ui,coverage]"]
# dev now pulls in every extra the test suite touches, so a single
# `uv sync --extra dev` (or `pip install -e ".[dev]"`) makes the whole
# suite runnable: fastapi+httpx for test_webapp, gpxpy+networkx for
# test_coverage, pymediainfo for test_media_metadata.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "Cloud_Dashcam_POC[ui,coverage,metadata]",
]

[project.scripts]
frame-extract = "frame_extract.cli:main"
frame-extract-ui = "frame_extract.webapp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
